name: Genesis C++ CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render demo (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/genesis_demo
          ./build/genesis_presets --list
          ./build/genesis_presets --render 0 genesis-preset-00.wav
          ./build/genesis_presets --render 5 genesis-preset-05.wav
      - name: Render demo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build\Release\genesis_demo.exe
          & .\build\Release\genesis_presets.exe --list
          & .\build\Release\genesis_presets.exe --render 0 genesis-preset-00.wav
          & .\build\Release\genesis_presets.exe --render 5 genesis-preset-05.wav
      - name: Upload WAV previews
        uses: actions/upload-artifact@v4
        with:
          name: genesis-wav-${{ matrix.os }}
          path: |
            genesis-demo.wav
            genesis-preset-00.wav
            genesis-preset-05.wav
          if-no-files-found: error
