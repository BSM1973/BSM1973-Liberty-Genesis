name: Genesis C++ CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Generate WAV demo
        run: cmake --build build --config Release --target genesis_demo
      - name: Render WAV
        run: ./build/genesis_demo
        if: runner.os != 'Windows'
      - name: Render WAV on Windows
        run: .\build\Release\genesis_demo.exe
        if: runner.os == 'Windows'
      - name: Upload demo WAV
        uses: actions/upload-artifact@v4
        with:
          name: genesis-demo-${{ matrix.os }}
          path: genesis-demo.wav
          if-no-files-found: error
